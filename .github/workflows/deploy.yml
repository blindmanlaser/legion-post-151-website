# Publishes the site to the Namecheap hosting account whenever main changes.
# Needs three repository secrets (Settings > Secrets and variables > Actions):
#   FTP_SERVER    e.g. ftp.conneautlegionpost151.org
#   FTP_USERNAME  the cPanel FTP account
#   FTP_PASSWORD  its password
# Until they are added, the workflow runs but skips the upload.
name: Deploy to Namecheap

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check FTP settings
        id: check
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -n "$FTP_SERVER" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "FTP secrets not set yet, skipping upload."; fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'

      - name: Upload site
        if: steps.check.outputs.ok == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: public_html/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
